<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="row"><label>Drive</label><select data-setting="drive"></select></div>
  <div class="row"><label>Label</label><input type="text" data-setting="title" placeholder="drive letter"></div>
  <div class="row"><label>Rotation</label>
    <select data-setting="rotate">
      <option value="off">Off</option>
      <option value="on">All drives in turn</option>
    </select>
  </div>
  <div class="row"><label>Change every</label><input type="range" min="2" max="30" step="1" data-setting="rotateEvery" data-default="5"><span class="value" data-value-of="rotateEvery"></span></div>
  <div class="row"><label>Alert below</label><input type="number" min="0" max="100" step="5" data-setting="alertLifeBelow" data-default="20"><span class="value">%</span></div>
  <div class="hint">The frame flashes red when remaining life drops below the threshold. Zero disables it.</div>
  <details>
    <summary>Appearance (colours and sizes)</summary>
  <div class="row"><label>Label colour</label>
    <select data-setting="labelColor">
      <option value="auto">Default</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
      <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="labelColor"></div>
  <div class="row"><label>Size</label><input type="range" min="9" max="22" step="1" data-setting="labelSize" data-default="13"><span class="value" data-value-of="labelSize"></span></div>
  <div class="row"><label>Hours colour</label>
    <select data-setting="subColor">
      <option value="auto">Default</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
      <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="subColor"></div>
  <div class="row"><label>Hours size</label><input type="range" min="8" max="16" step="1" data-setting="subSize" data-default="11"><span class="value" data-value-of="subSize"></span></div>
  </details>
  <div class="status" data-status></div>
  <script src="pi.js"></script>
</body>
</html>
