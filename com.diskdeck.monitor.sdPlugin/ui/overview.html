<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="row"><label>Title</label><input type="text" data-setting="title" placeholder="Disks"></div>
  <div class="row"><label>Title colour</label>
    <select data-setting="labelColor">
      <option value="auto">Default</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
      <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="labelColor"></div>
  <div class="row"><label>Size</label><input type="range" min="9" max="22" step="1" data-setting="labelSize" data-default="13"><span class="value" data-value-of="labelSize"></span></div>
  <div class="row"><label>Health dot</label>
    <select data-setting="showHealth">
      <option value="on">Show remaining life</option>
      <option value="off">Hide</option>
    </select>
  </div>
  <details>
    <summary>Drive rows</summary>
  <div class="row"><label>Letter colour</label>
    <select data-setting="rowColor">
      <option value="auto">Default</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
      <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="rowColor"></div>
  <div class="row"><label>Size</label><input type="range" min="8" max="18" step="1" data-setting="rowSize" data-default="12"><span class="value" data-value-of="rowSize"></span></div>
  <div class="row"><label>Usage % colour</label>
    <select data-setting="pctColor">
      <option value="auto">Default</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
      <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="pctColor"></div>
  <div class="row"><label>Usage size</label><input type="range" min="7" max="14" step="1" data-setting="pctSize" data-default="9"><span class="value" data-value-of="pctSize"></span></div>
  </details>
  <div class="hint">Bars stay colour-coded by how full each drive is.</div>
  <div class="status" data-status></div>
  <script src="pi.js"></script>
</body>
</html>
