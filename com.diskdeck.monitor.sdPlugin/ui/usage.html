<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="row"><label>Drive</label><select data-setting="drive"></select></div>
  <div class="row"><label>Centre value</label>
    <select data-setting="centerMode">
      <option value="pct">Percentage</option>
      <option value="gb">Used space</option>
    </select>
  </div>
  <div class="row"><label>Style</label>
    <select data-setting="style">
      <option value="ring">Ring</option>
      <option value="bar">Bar</option>
    </select>
  </div>
  <div class="row"><label>Value colour</label>
    <select data-setting="accent">
      <option value="auto">Automatic (green/yellow/red)</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
          <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="accent"></div>
  <div class="row"><label>Label</label><input type="text" data-setting="title" placeholder="automatic"></div>
  <div class="row"><label>Rotation</label>
    <select data-setting="rotate">
      <option value="off">Off</option>
      <option value="on">All drives in turn</option>
    </select>
  </div>
  <div class="row"><label>Change every</label><input type="range" min="2" max="30" step="1" data-setting="rotateEvery" data-default="5"><span class="value" data-value-of="rotateEvery"></span></div>
  <div class="hint">With rotation on, the key jumps straight to the next one.</div>
  <div class="row"><label>Long press</label>
    <select data-setting="longPress">
      <option value="on">Opens the disk view</option>
      <option value="off">No action</option>
    </select>
  </div>
  <div class="row"><label>Alert below</label><input type="number" min="0" max="100" step="5" data-setting="alertFreeBelow" data-default="10"><span class="value">%</span></div>
  <div class="hint">The frame flashes red when free space runs low. Zero disables it.</div>
  <details>
    <summary>Appearance (colours and sizes)</summary>
  <div class="row"><label>Label colour</label>
    <select data-setting="labelColor">
      <option value="auto">Default</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
          <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="labelColor"></div>
  <div class="row"><label>Size</label><input type="range" min="9" max="22" step="1" data-setting="labelSize" data-default="13"><span class="value" data-value-of="labelSize"></span></div>
  <div class="row"><label>Usage colour</label>
    <select data-setting="subColor">
      <option value="auto">Default</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
          <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="subColor"></div>
  <div class="row"><label>Usage size</label><input type="range" min="9" max="20" step="1" data-setting="subSize" data-default="12"><span class="value" data-value-of="subSize"></span></div>
  <div class="row"><label>Usage text (ring)</label>
    <select data-setting="subLayout">
      <option value="one">One line (396 / 932 GB)</option>
      <option value="two">Two lines</option>
    </select>
  </div>
  <div class="row"><label>Usage offset</label><input type="range" min="-24" max="10" step="1" data-setting="subOffset" data-default="0"><span class="value" data-value-of="subOffset"></span></div>
  </details>
  <div class="hint">Press the key to cycle: percentage, used space, bar.</div>
  <div class="status" data-status></div>
  <script src="pi.js"></script>
</body>
</html>
