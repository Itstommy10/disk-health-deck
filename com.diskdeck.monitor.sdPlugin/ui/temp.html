<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="row"><label>Drive</label><select data-setting="drive"></select></div>
  <div class="row"><label>Label</label><input type="text" data-setting="title" placeholder="drive letter"></div>
  <div class="row"><label>Rotation</label>
    <select data-setting="rotate">
      <option value="off">Off</option>
      <option value="on">All drives in turn</option>
    </select>
  </div>
  <div class="row"><label>Change every</label><input type="range" min="2" max="30" step="1" data-setting="rotateEvery" data-default="5"><span class="value" data-value-of="rotateEvery"></span></div>
  <div class="hint">With rotation on, the key jumps straight to the next one.</div>
  <div class="row"><label>Long press</label>
    <select data-setting="longPress">
      <option value="on">Opens the disk view</option>
      <option value="off">No action</option>
    </select>
  </div>
  <div class="row"><label>Alert above</label><input type="number" min="0" max="120" step="5" data-setting="alertTempAbove" data-default="60"><span class="value">°C</span></div>
  <div class="hint">The frame flashes red above the threshold. Zero disables it.</div>
  <details>
    <summary>Appearance (colours and sizes)</summary>
  <div class="row"><label>Label colour</label>
    <select data-setting="labelColor">
      <option value="auto">Default</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
          <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="labelColor"></div>
  <div class="row"><label>Size</label><input type="range" min="9" max="22" step="1" data-setting="labelSize" data-default="13"><span class="value" data-value-of="labelSize"></span></div>
  <div class="row"><label>Peak colour</label>
    <select data-setting="peakColor">
      <option value="auto">Dynamic (by band)</option>
      <option value="green">Green</option>
      <option value="cyan">Cyan</option>
      <option value="yellow">Yellow</option>
      <option value="orange">Orange</option>
      <option value="red">Red</option>
      <option value="purple">Purple</option>
      <option value="blue">Blue</option>
      <option value="custom">Custom (RGB)</option>
    </select>
  </div>
  <div class="rgb" data-rgb-for="peakColor"></div>
  <div class="row"><label>Peak size</label><input type="range" min="10" max="26" step="1" data-setting="peakSize" data-default="26"><span class="value" data-value-of="peakSize"></span></div>
  </details>
  <div class="row"><label>Content</label>
    <select data-setting="showValue">
      <option value="si">Temperature in °C</option>
      <option value="no">State (NOMINAL, HOT...)</option>
    </select>
  </div>
  <div class="row"><label>Sensors</label><input type="text" data-setting="sensorEndpoint" placeholder="auto (e.g. 127.0.0.1:8085)"></div>
  <div class="hint">Press the key to switch between temperature and state.</div>
  <div class="hint">Source: LibreHardwareMonitor (web server enabled) or HWiNFO with Shared Memory Registry.</div>
  <div class="status" data-status></div>
  <script src="pi.js"></script>
</body>
</html>
